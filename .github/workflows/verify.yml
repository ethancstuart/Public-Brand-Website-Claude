name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # The mobile project uses the iPhone 14 descriptor, whose default browser
      # is WebKit — chromium alone is not enough.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      # Playwright's webServer builds and starts the app itself.
      # sync-resume.sh tolerates the absent home-base checkout in CI and the
      # synced resume.md is committed, so the build succeeds without it.
      # The register stamps each row with its repo's last push, fetched at build
      # time. The workflow token reads this owner's public repos at the
      # authenticated rate limit; unauthenticated calls from shared runners are
      # routinely exhausted. Private repos stay unstamped here, which is fine.
      - name: Route and content tests
        run: npx playwright test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke the built site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npm start &
          until curl -sf -o /dev/null http://localhost:3000; do sleep 1; done
          bash scripts/smoke.sh http://localhost:3000
